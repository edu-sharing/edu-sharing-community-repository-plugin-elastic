{{- if .Values.rag.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-embedding
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
spec:
  replicas: {{ .Values.rag.embedding.replicaCount }}
  selector:
    matchLabels: {{ include "edusharing_common_lib.labels.app" . | nindent 6 }}
      app.kubernetes.io/component: embedding
  template:
    metadata:
      labels: {{ include "edusharing_common_lib.labels.app" . | nindent 8 }}
        app.kubernetes.io/component: embedding
      annotations:
        sidecar.istio.io/inject: {{ .Values.global.cluster.istio.enabled | quote }}
        {{- with merge .Values.podAnnotations .Values.global.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
      - name: embedding
        image: {{ .Values.rag.embedding.image.name }}:{{ .Values.rag.embedding.image.tag }}
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        args:
          - "--model-id"
          - {{ .Values.rag.profile.model | quote }}
          - "--max-batch-tokens"
          - {{ .Values.rag.embedding.maxBatchTokens | quote }}
        ports:
          - name: http
            containerPort: 80
        # The model is loaded before the service answers, which on CPU takes a while - a
        # readiness probe that starts too early would restart the pod mid-load.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ .Values.rag.embedding.probe.initialDelaySeconds }}
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: {{ .Values.rag.embedding.probe.initialDelaySeconds }}
          periodSeconds: 30
        resources: {{- toYaml .Values.rag.embedding.resources | nindent 10 }}
        volumeMounts:
          - name: model-cache
            mountPath: /data
      volumes:
        - name: model-cache
          {{- if .Values.rag.embedding.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "edusharing_common_lib.names.name" . }}-embedding
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.rag.embedding.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rag.embedding.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
