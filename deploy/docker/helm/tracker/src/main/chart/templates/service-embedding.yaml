{{- if .Values.rag.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-embedding
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
    app.kubernetes.io/component: embedding
{{- end }}
