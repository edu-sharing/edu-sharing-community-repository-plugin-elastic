{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- if .Values.global.metrics.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
spec:
  groups:
    - name: {{ include "edusharing_common_lib.names.name" . }}
      rules:
        {{- if .Values.config.metrics.rules.jvmHighGCRate.enabled }}
        - alert: jvmHighGCRate
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} has high JVM GC time rate (> {{ .Values.config.metrics.rules.jvmHighGCRate.config.max | float64 }}s) since {{ .Values.config.metrics.rules.jvmHighGCRate.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has high JVM GC time rate.
          expr: >-
            rate(jvm_gc_collection_seconds_sum{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"}[5m]) > {{ .Values.config.metrics.rules.jvmHighGCRate.config.max | float64 }}
          for: {{ .Values.config.metrics.rules.jvmHighGCRate.for }}
          labels: {{ toYaml .Values.config.metrics.rules.jvmHighGCRate.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.trackingACLDelay.enabled }}
        - alert: trackingACLDelay
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} has high tracking acl delay (> {{ .Values.config.metrics.rules.trackingACLDelay.config.max | float64 }}s) since {{ .Values.config.metrics.rules.trackingACLDelay.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has high tracking acl delay.
          expr: >-
            aclDelay{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"} > {{ .Values.config.metrics.rules.trackingACLDelay.config.max | float64 }}
          for: {{ .Values.config.metrics.rules.trackingACLDelay.for }}
          labels: {{ toYaml .Values.config.metrics.rules.trackingACLDelay.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.trackingACLProgress.enabled }}
        - alert: trackingACLProgress
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} has low tracking acl progress (< {{ .Values.config.metrics.rules.trackingACLProgress.config.min | float64 }}%) since {{ .Values.config.metrics.rules.trackingACLProgress.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has low tracking acl progress.
          expr: >-
            aclProgress{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"} < {{ .Values.config.metrics.rules.trackingACLProgress.config.min | float64 }}
          for: {{ .Values.config.metrics.rules.trackingACLProgress.for }}
          labels: {{ toYaml .Values.config.metrics.rules.trackingACLProgress.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.trackingTransactionDelay.enabled }}
        - alert: trackingTransactionDelay
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} has high tracking transaction delay (> {{ .Values.config.metrics.rules.trackingTransactionDelay.config.max | float64 }}s) since {{ .Values.config.metrics.rules.trackingTransactionDelay.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has high tracking transaction delay.
          expr: >-
            transactionDelay{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"} > {{ .Values.config.metrics.rules.trackingTransactionDelay.config.max | float64 }}
          for: {{ .Values.config.metrics.rules.trackingTransactionDelay.for }}
          labels: {{ toYaml .Values.config.metrics.rules.trackingTransactionDelay.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.trackingTransactionProgress.enabled }}
        - alert: trackingTransactionProgress
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} has low tracking transaction progress (< {{ .Values.config.metrics.rules.trackingTransactionProgress.config.min | float64 }}%) since {{ .Values.config.metrics.rules.trackingTransactionProgress.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has low tracking transaction progress.
          expr: >-
            transactionProgress{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"} < {{ .Values.config.metrics.rules.trackingTransactionProgress.config.min | float64 }}
          for: {{ .Values.config.metrics.rules.trackingTransactionProgress.for }}
          labels: {{ toYaml .Values.config.metrics.rules.trackingTransactionProgress.labels | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}