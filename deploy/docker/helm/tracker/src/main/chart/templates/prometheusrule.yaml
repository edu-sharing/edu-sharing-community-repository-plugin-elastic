{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- if .Values.global.metrics.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
spec:
  groups:
    - name: {{ include "edusharing_common_lib.names.name" . }}
      rules:
        {{- if .Values.config.metrics.rules.jvmHighGCRate.enabled }}
        - alert: jvmHighGCRate
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} has high JVM GC time rate (> {{ .Values.config.metrics.rules.jvmHighGCRate.config.max | float64 }}s) since {{ .Values.config.metrics.rules.jvmHighGCRate.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has high JVM GC time rate.
          expr: >-
            rate(jvm_gc_collection_seconds_sum{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"}[5m]) > {{ .Values.config.metrics.rules.jvmHighGCRate.config.max | float64 }}
          for: {{ .Values.config.metrics.rules.jvmHighGCRate.for }}
          labels: {{ toYaml .Values.config.metrics.rules.jvmHighGCRate.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.trackingDelay.enabled }}
        - alert: trackingDelay
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} tracker {{ "{{ $labels.tracker }}" }} has high tracking delay (> {{ .Values.config.metrics.rules.trackingDelay.config.max | float64 }}s) since {{ .Values.config.metrics.rules.trackingDelay.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has high tracking delay.
          expr: >-
            trackerDelay{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"{{ with .Values.config.metrics.rules.trackingDelay.exclude }},tracker!~"{{ join "|" . }}"{{ end }}} > {{ .Values.config.metrics.rules.trackingDelay.config.max | float64 }}
          for: {{ .Values.config.metrics.rules.trackingDelay.for }}
          labels: {{ toYaml .Values.config.metrics.rules.trackingDelay.labels | nindent 12 }}
        {{- end }}
        {{- if .Values.config.metrics.rules.trackingProgress.enabled }}
        - alert: trackingProgress
          annotations:
            description: >-
              {{ include "edusharing_common_lib.names.name" . }} tracker {{ "{{ $labels.tracker }}" }} has low tracking progress (< {{ .Values.config.metrics.rules.trackingProgress.config.min | float64 }}%) since {{ .Values.config.metrics.rules.trackingProgress.for }}.
            summary: {{ include "edusharing_common_lib.names.name" . }} has low tracking progress.
          expr: >-
            trackerProgress{namespace="{{ .Release.Namespace }}",pod=~"{{ include "edusharing_common_lib.names.name" . }}.*"{{ with .Values.config.metrics.rules.trackingProgress.exclude }},tracker!~"{{ join "|" . }}"{{ end }}} < {{ .Values.config.metrics.rules.trackingProgress.config.min | float64 }}
          for: {{ .Values.config.metrics.rules.trackingProgress.for }}
          labels: {{ toYaml .Values.config.metrics.rules.trackingProgress.labels | nindent 12 }}
        {{- end }}
{{- end }}
{{- end }}
