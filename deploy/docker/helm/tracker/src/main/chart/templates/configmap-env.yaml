apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edusharing_common_lib.names.name" . }}-env
  labels: {{ include "edusharing_common_lib.labels.app" . | nindent 4 }}
data:
  JAVA_OPTS: >-
    {{- with .Values.config.jvm.ram.minPercentage }}
    -XX:InitialRAMPercentage={{ . }}
    {{- end }}
    {{- with .Values.config.jvm.ram.maxPercentage }}
    -XX:MaxRAMPercentage={{ . }}
    {{- end }}    
    -Dcom.sun.management.jmxremote
    -Dcom.sun.management.jmxremote.authenticate=false
    -Dcom.sun.management.jmxremote.port=7199
    -Dcom.sun.management.jmxremote.ssl=false
    {{- if default .Values.global.debug .Values.debug }}
    -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5005
    {{- end }}
  {{- with .Values.config.jvm.malloc.arenaMax }}
  MALLOC_ARENA_MAX: {{ . | quote }}
  {{- end }}
  REPOSITORY_SEARCH_ELASTIC_INDEX_HOST: {{ .Values.config.search.elastic.host | quote }}
  REPOSITORY_SEARCH_ELASTIC_INDEX_PORT: {{ .Values.config.search.elastic.port | quote }}
  REPOSITORY_SEARCH_ELASTIC_INDEX_REPLICAS: {{ .Values.config.search.elastic.index.replicas | quote }}
  REPOSITORY_SEARCH_ELASTIC_INDEX_SHARDS: {{ .Values.config.search.elastic.index.shards | quote }}
  REPOSITORY_SEARCH_ELASTIC_TRACKER_MANAGEMENT_BIND: "0.0.0.0"
  REPOSITORY_SERVICE_HOST: {{ .Values.config.repository.host | quote }}
  REPOSITORY_SERVICE_PORT: {{ .Values.config.repository.port | quote }}
  SPRING_APPLICATION_JSON: {{ .Values.config.override | quote }}
  {{- if .Values.rag.enabled }}
  # Environment variables rather than entrypoint.sh: Spring Boot binds them natively and
  # they outrank the application.properties baked into the image, so the switch needs no
  # change to the image at all. The list index follows the usual relaxed-binding spelling.
  TRACKER_RAG_ENABLED: "true"
  TRACKER_RAG_PROFILES_0_ID: {{ .Values.rag.profile.id | quote }}
  TRACKER_RAG_PROFILES_0_ACTIVE: "true"
  TRACKER_RAG_PROFILES_0_MODEL: {{ .Values.rag.profile.model | quote }}
  TRACKER_RAG_PROFILES_0_DIMENSIONS: {{ .Values.rag.profile.dimensions | quote }}
  TRACKER_RAG_PROFILES_0_BASEURL: {{ printf "http://%s-embedding" (include "edusharing_common_lib.names.name" .) | quote }}
  {{- with .Values.rag.profile.maxChunksPerNode }}
  TRACKER_RAG_PROFILES_0_MAXCHUNKSPERNODE: {{ . | quote }}
  {{- end }}
  {{- with .Values.rag.index.shards }}
  ELASTIC_INDEX_RAG_NUMBER_OF_SHARDS: {{ . | quote }}
  {{- end }}
  {{- with .Values.rag.index.replicas }}
  ELASTIC_INDEX_RAG_NUMBER_OF_REPLICAS: {{ . | quote }}
  {{- end }}
  {{- end }}
