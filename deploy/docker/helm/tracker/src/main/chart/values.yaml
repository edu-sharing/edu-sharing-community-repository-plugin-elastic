########################################################################################################################
# GLOBAL
########################################################################################################################

## @section Global parameters
global:

  ## @param global.annotations Define global annotations
  annotations: {}

  cluster:

    istio:
      ## @param global.cluster.istio.enabled Enable Istio Service mesh
      enabled: false

    pdb:
      ## @param global.cluster.pdb.enabled Enable PDB
      enabled: false

  ## @param global.debug Enable global debugging
  debug: false

  image:
    ## @param global.image.pullPolicy Set global image pullPolicy
    pullPolicy: Always
    ## @param global.image.pullSecrets Set global image pullSecrets
    pullSecrets: []
    ## @param global.image.registry Set global image container registry
    registry: ${docker.registry}
    ## @param global.image.repository Set global image container repository
    repository: ${docker.repository}
    ## @param global.image.common Set global image container common
    common: ${docker.common}

  metrics:
    rules:
      ## @param global.metrics.rules.enabled Enable metrics rules
      enabled: false
    scrape:
      ## @param global.metrics.scrape.interval Set prometheus scrape interval
      interval: 60s
      ## @param global.metrics.scrape.timeout Set prometheus scrape timeout
      timeout: 60s
    servicemonitor:
      ## @param global.metrics.servicemonitor.enabled Enable metrics service monitor
      enabled: false

  ## @param global.password Set global password
  password: ""

  ## @param global.security Set global custom security parameters
  security: {}

########################################################################################################################
# LOCAL
########################################################################################################################

## @section Local parameters
## @param nameOverride Override name
nameOverride: edusharing-repository-search-elastic-tracker

image:
  ## @param image.name Set image name
  name: ${docker.prefix}-deploy-docker-build-tracker
  ## @param image.tag Set image tag
  tag: ${docker.tag}

########################################################################################################################

## @param replicaCount Define amount of parallel replicas to run
replicaCount: 1

########################################################################################################################

service:

  port:
    ## @param service.port.management Set port for service management
    management: 8081

config:

  jvm:
    ram:
      ## @param config.jvm.ram.minPercentage Set minimum memory in percentages
      minPercentage: "90.0"
      ## @param config.jvm.ram.maxPercentage Set maximum memory in percentages
      maxPercentage: "90.0"
    malloc:
      ## @param config.jvm.malloc.arenaMax Cap glibc malloc arenas (MALLOC_ARENA_MAX) to bound native/off-heap RSS growth independent of the JVM heap
      arenaMax: "2"

  metrics:
    ## @param config.metrics.enabled Enable metrics
    enabled: true
    ## @param config.metrics.relabelings Define relabelings for metrics
    relabelings: []

    rules:

      jvmHighGCRate:
        ## @param config.metrics.rules.jvmHighGCRate.enabled Enable metric rule jvmHighGCRate
        enabled: true
        config:
          ## @param config.metrics.rules.jvmHighGCRate.config.max Set metric rule jvmHighGCRate max gc rate
          max: 0.3
        ## @param config.metrics.rules.jvmHighGCRate.for Set metric rule jvmHighGCRate wait interval
        for: 5m
        labels:
          ## @param config.metrics.rules.jvmHighGCRate.labels.severity Set metric rule jvmHighGCRate severity level
          severity: critical

      ## the tracker exposes one gauge per dimension for all trackers, told apart by the `tracker` label,
      ## so these rules cover every tracker at once - the alert carries the tracker name in its labels.
      trackingDelay:
        ## @param config.metrics.rules.trackingDelay.enabled Enable metric rule trackingDelay
        enabled: true
        config:
          ## @param config.metrics.rules.trackingDelay.config.max Set metric rule trackingDelay max delay seconds
          max: 300
        ## @param config.metrics.rules.trackingDelay.for Set metric rule trackingDelay wait interval
        for: 30m
        ## @param config.metrics.rules.trackingDelay.exclude Trackers excluded from metric rule trackingDelay
        exclude: []
        labels:
          ## @param config.metrics.rules.trackingDelay.labels.severity Set metric rule trackingDelay severity level
          severity: critical

      trackingProgress:
        ## @param config.metrics.rules.trackingProgress.enabled Enable metric rule trackingProgress
        enabled: true
        config:
          ## @param config.metrics.rules.trackingProgress.config.min Set metric rule trackingProgress min progress rate
          min: 95
        ## @param config.metrics.rules.trackingProgress.for Set metric rule trackingProgress wait interval
        for: 5m
        ## @param config.metrics.rules.trackingProgress.exclude Trackers excluded from metric rule trackingProgress
        exclude: []
        labels:
          ## @param config.metrics.rules.trackingProgress.labels.severity Set metric rule trackingProgress severity level
          severity: critical

  ## @param config.override Configure overrides
  override: ""

  repository:

    ## @param config.repository.host Configure repository host
    host: edusharing-repository-service
    ## @param config.repository.port Configure repository port
    port: 8080
    ## @param config.repository.password Configure repository password
    password: ""

  tracker:
    ## @param config.tracker.customScript Configure a custom script for the tracker
    customScript: ""
    ## @param config.tracker.customSynonyms Configure custom synonyms file for the tracker
    customSynonyms: ""

  search:

    elastic:
      ## @param config.search.elastic.host Set elasticsearch host
      host: edusharing-repository-search-elastic-index
      ## @param config.search.elastic.port Set elasticsearch port
      port: 9200
      index:
        ## @param config.search.elastic.index.shards Set elasticsearch index shards
        shards: 1
        ## @param config.search.elastic.index.replicas Set elasticsearch index replicas
        replicas: 2

########################################################################################################################

multistage:
  ## @param multistage.enabled Enable multistage
  enabled: false
  ## @param multistage.stages Set stages for multistage
  # e.g.:
  #    - name: blue
  #      spec:
  #        config:
  #          override: ""
  #          tracker:
  #              customScript: ""
  #              customSynonyms: ""
  #    - name: green
  #      spec:
  #        config:
  #          override: ""
  #          tracker:
  #              customScript: ""
  #              customSynonyms: ""
  stages: []


########################################################################################################################

## @param debug Enable debugging
debug: false

########################################################################################################################

## @param nodeAffinity Set node affinity
nodeAffinity: {}

## @param tolerations Set tolerations
tolerations: []

########################################################################################################################

## @param podAnnotations Set custom pod annotations
podAnnotations: {}

podSecurityContext:
  ## @param podSecurityContext.fsGroup Set fs group for access
  fsGroup: 1000
  ## @param podSecurityContext.fsGroupChangePolicy Set change policy for fs group
  fsGroupChangePolicy: OnRootMismatch

securityContext:

  ## @param securityContext.allowPrivilegeEscalation Allow privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    ## @param securityContext.capabilities.drop Set drop capabilities
    drop:
    - ALL
  ## @param securityContext.runAsUser Define user to run under
  runAsUser: 1000

########################################################################################################################

## @param terminationGracePeriod Define grace period for termination
terminationGracePeriod: 120

startupProbe:
  ## @param startupProbe.failureThreshold Failure threshold for startupProbe
  failureThreshold: 30
  ## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  initialDelaySeconds: 0
  ## @param startupProbe.periodSeconds Period seconds for startupProbe
  periodSeconds: 20
  ## @param startupProbe.successThreshold Success threshold for startupProbe
  successThreshold: 1
  ## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
  timeoutSeconds: 10

livenessProbe:
  ## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
  failureThreshold: 3
  ## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  initialDelaySeconds: 30
  ## @param livenessProbe.periodSeconds Period seconds for livenessProbe
  periodSeconds: 30
  ## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  timeoutSeconds: 10

readinessProbe:
  ## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
  failureThreshold: 1
  ## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  initialDelaySeconds: 10
  ## @param readinessProbe.periodSeconds Period seconds for readinessProbe
  periodSeconds: 10
  ## @param readinessProbe.successThreshold Set threshold for success on readiness probe
  successThreshold: 1
  ## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  timeoutSeconds: 10

########################################################################################################################

resources:

  limits:
    ## @param resources.limits.cpu Set CPU limit on resources
    cpu: 500m
    ## @param resources.limits.memory Set memory limit on resources
    memory: 2Gi
  requests:
    ## @param resources.requests.cpu Set CPU for requests on resources
    cpu: 500m
    ## @param resources.requests.memory Set memory for requests on resources
    memory: 2Gi

########################################################################################################################

########################################################################################################################
# RAG
########################################################################################################################

## @section RAG / semantic search
rag:

  ## @param rag.enabled Enable the RAG chunk index and its embedding service
  ## Off by default. The first run walks the entire transaction history and embeds every
  ## node in the repository - the one genuinely expensive moment in this pipeline. With this
  ## off, neither the embedding deployment nor any RAG configuration is rendered at all.
  enabled: false

  profile:
    ## @param rag.profile.id Embedding profile id; also the suffix of its index and its tracker cursor
    ## Change it together with the model. A profile change builds a second index beside the
    ## existing one and the alias is switched over once it has caught up.
    id: bge-m3-v1
    ## @param rag.profile.model Embedding model
    model: BAAI/bge-m3
    ## @param rag.profile.dimensions Vector length of the model - must match it exactly
    dimensions: 1024
    ## @param rag.profile.maxChunksPerNode Ceiling per node; anything beyond is reported, not dropped silently
    maxChunksPerNode: 300

  index:
    ## @param rag.index.shards Shards of the chunk index - it holds a multiple of the workspace index's documents
    shards: 3
    ## @param rag.index.replicas Replicas of the chunk index
    replicas: 1

  embedding:
    ## @param rag.embedding.replicaCount Replicas of the embedding service
    replicaCount: 1

    image:
      ## @param rag.embedding.image.name Embedding service image
      ## NOTE: TEI is published on ghcr.io, which the existing Docker Hub mirror does not
      ## serve. Mirror it into your own registry and point this at the copy before going live.
      name: ghcr.io/huggingface/text-embeddings-inference
      ## @param rag.embedding.image.tag Image tag - use a CUDA variant on GPU nodes
      tag: cpu-1.8

    ## @param rag.embedding.maxBatchTokens Token budget per inference batch
    maxBatchTokens: 8192

    probe:
      ## @param rag.embedding.probe.initialDelaySeconds Grace period while the model loads
      ## Loading takes minutes on CPU; probing too early restarts the pod mid-load.
      initialDelaySeconds: 120

    persistence:
      ## @param rag.embedding.persistence.enabled Keep the downloaded model across restarts
      ## Without it the model is downloaded again on every pod start - several gigabytes.
      enabled: false
      spec:
        ## @param rag.embedding.persistence.spec.accessModes Access modes of the model cache claim
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            ## @param rag.embedding.persistence.spec.resources.requests.storage Size of the model cache claim
            storage: 20Gi

    ## @param rag.embedding.resources Resources of the embedding service
    ## The initial run wants a GPU; steady-state delta tracking does not. Set nvidia.com/gpu
    ## here together with nodeSelector to place it on a GPU node.
    resources: {}

    ## @param rag.embedding.nodeSelector Schedule the embedding service, e.g. onto GPU nodes
    nodeSelector: {}
    ## @param rag.embedding.tolerations Tolerations for the embedding service
    tolerations: []

  llm:
    ## @param rag.llm.enabled Run a local model to formulate answers
    ## Only needed when the repository is configured with
    ## elasticsearch.rag.answer.provider = "openai" pointing at this service. Point that at a
    ## hosted provider instead and leave this off - then the passages leave the infrastructure,
    ## which for a corpus with non-public fulltexts is a decision, not a default.
    enabled: false

    ## @param rag.llm.replicaCount Replicas of the answer service
    replicaCount: 1

    image:
      ## @param rag.llm.image.name Answer service image
      ## Ollama: published on Docker Hub, so the existing mirror serves it - unlike TEI - and its
      ## /v1/chat/completions is OpenAI-compatible, so the repository uses one client for this and
      ## for any hosted provider.
      name: ollama/ollama
      ## @param rag.llm.image.tag Image tag
      tag: 0.5.7

    ## @param rag.llm.model Model to pull and serve
    ## Apache-2.0, about 1Gi resident. Measured against qwen2.5:7b on a 16-thread CPU host: the 7B
    ## produced 1.8 tokens per second and its 4.7Gi pushed the host into swap, at which point a
    ## single question took over a minute just to embed. On a GPU node the 7B is the better answer
    ## and this is where to change it; on CPU it is not usable interactively.
    model: qwen2.5:1.5b-instruct

    ## @param rag.llm.contextLength Token window the model is served with
    ## Ollama's own default is 2048, which a RAG prompt exceeds - it was truncated silently, so
    ## the model answered from part of the passages. This must comfortably exceed
    ## elasticsearch.rag.answer.maxPromptChars divided by about 3.6, plus maxTokens.
    contextLength: 8192

    ## @param rag.llm.keepAlive How long a loaded model stays resident
    ## Ollama unloads after five idle minutes by default; the next question then waits for the
    ## load again, which on CPU is tens of seconds.
    keepAlive: 24h

    ## @param rag.llm.numParallel Concurrent requests per model
    ## Above 1 the model is held in memory once per slot and competes with the embedding service
    ## for cores. Raise it only where both have their own node.
    numParallel: 1


    probe:
      ## @param rag.llm.probe.initialDelaySeconds Grace period while the model is pulled and loaded
      initialDelaySeconds: 60
      ## @param rag.llm.probe.failureThreshold Readiness attempts while the model is still downloading
      ## The first start downloads several gigabytes; at 15s per attempt this allows about an hour.
      failureThreshold: 240

    persistence:
      ## @param rag.llm.persistence.enabled Keep the pulled model across restarts
      enabled: false
      spec:
        ## @param rag.llm.persistence.spec.accessModes Access modes of the model cache claim
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            ## @param rag.llm.persistence.spec.resources.requests.storage Size of the model cache claim
            storage: 30Gi

    ## Resources of the answer service.
    ## Set a CPU limit here, not an Ollama environment variable - there is no OLLAMA_NUM_THREAD and
    ## it would be ignored. Unbounded, Ollama takes every core and starves the embedding service
    ## until a question no longer embeds inside its timeout, so the search breaks because the
    ## answer model is busy. Set nvidia.com/gpu together with nodeSelector for a GPU node.
    resources:
      limits:
        ## @param rag.llm.resources.limits.cpu Cores the answer service may use
        cpu: "4"
        ## @param rag.llm.resources.limits.memory Enough for a 1.5B model to stay resident
        memory: 4Gi

    ## @param rag.llm.nodeSelector Schedule the answer service, e.g. onto GPU nodes
    nodeSelector: {}
    ## @param rag.llm.tolerations Tolerations for the answer service
    tolerations: []


job:

  migration:
    ## @param job.migration.enabled Enable migration job
    enabled: false

    image:
      ## @param job.migration.image.name Set name for migration job image
      name: ${docker.prefix}-deploy-docker-build-tracker
      ## @param job.migration.image.tag Set tag for migration job image
      tag: ${docker.tag}

    ## @param job.migration.podAnnotations Set pod annotations for migration job
    podAnnotations: {}

    startupProbe:
      ## @param job.migration.startupProbe.failureThreshold Failure threshold for startupProbe
      failureThreshold: 300
      ## @param job.migration.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
      initialDelaySeconds: 0
      ## @param job.migration.startupProbe.periodSeconds Period seconds for startupProbe
      periodSeconds: 20
      ## @param job.migration.startupProbe.successThreshold Success threshold for startupProbe
      successThreshold: 1
      ## @param job.migration.startupProbe.timeoutSeconds Timeout seconds for startupProbe
      timeoutSeconds: 10

    livenessProbe:
      ## @param job.migration.livenessProbe.failureThreshold Failure threshold for livenessProbe
      failureThreshold: 3
      ## @param job.migration.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
      initialDelaySeconds: 30
      ## @param job.migration.livenessProbe.periodSeconds Period seconds for livenessProbe
      periodSeconds: 30
      ## @param job.migration.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
      timeoutSeconds: 10

    readinessProbe:
      ## @param job.migration.readinessProbe.failureThreshold Failure threshold for readinessProbe
      failureThreshold: 1
      ## @param job.migration.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
      initialDelaySeconds: 10
      ## @param job.migration.readinessProbe.periodSeconds Period seconds for readinessProbe
      periodSeconds: 10
      ## @param job.migration.readinessProbe.successThreshold Set threshold for success on readiness probe
      successThreshold: 1
      ## @param job.migration.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
      timeoutSeconds: 10

    resources:

      limits:
        ## @param job.migration.resources.limits.cpu Set CPU limit on resources
        cpu: 500m
        ## @param job.migration.resources.limits.memory Set memory limit on resources
        memory: 2Gi
      requests:
        ## @param job.migration.resources.requests.cpu Set CPU for requests on resources
        cpu: 500m
        ## @param job.migration.resources.requests.memory Set memory for requests on resources
        memory: 2Gi

    securityContext:

      ## @param job.migration.securityContext.runAsUser Set user to run migration job under
      runAsUser: 1000
