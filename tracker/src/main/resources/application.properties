# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %logger{36}.%M - %msg%n
# log contents of jax-rs requests and response
log.requests=false

#logging.level.root=WARN
logging.level.org.elasticsearch.client.RestClient=ERROR
#uncomment to prevent WARN stacktraces when edu-sharig or elastic is not reachable
logging.level.org.apache.cxf=ERROR
#logging.level.org.apache.http=DEBUG
logging.pattern.console=%d %p %C{40}.%M [%t] %m%n%ex

server.address=0.0.0.0
server.port=8080

alfresco.host=localhost
alfresco.port=8080
alfresco.protocol=http
alfresco.username=admin
alfresco.password=admin
# Timeout to wait until alfresco based apis answer
# keep this high enough to make sure that the content processor does finish in time
alfresco.readTimeout=900000

spring.http.codecs.max-in-memory-size = 50MB

elastic.host=localhost
elastic.port=9200
elastic.protocol=http
elastic.socketTimeout=-1
# timeout in milliseconds until a connection is established
# default -1, infinite 0
elastic.connectTimeout=-1
# timeout in milliseconds used when requesting a connection from the connection manager
# default -1, infinite 0
elastic.connectionRequestTimeout=-1
elastic.index.number_of_shards=1
elastic.index.number_of_replicas=1
elastic.maxCollectionChildItemsUpdateSize=500



#filter before getNode


app.types.io.type=ccm:io
app.types.io.index=true
app.types.io.fetchChildren=ALL
app.types.io.reindexParent.enabled=true
app.types.io.reindexParent.filter.hasAspects=ccm:io_childobject

app.types.map.type=ccm:map
app.types.map.index=true

app.types.usage.type=ccm:usage
app.types.usage.index=true
app.types.usage.reindexParent.enabled = true

app.types.collection_proposal.type=ccm:collection_proposal
app.types.collection_proposal.index=true
app.types.collection_proposal.reindexParent.enabled = true

app.types.rating.type=ccm:rating
app.types.rating.index=false
app.types.rating.reindexParent.enabled = true

app.types.comment.type=ccm:comment
app.types.comment.index=false
app.types.comment.reindexParent.enabled = true

app.types.toolpermission.type=ccm:toolpermission
app.types.toolpermission.index=true

app.types.assignment.type=ccm:assignment
app.types.assignment.index=true
app.types.assignment.fetchChildren=ccm:submissions

app.types.submissions.type=ccm:submissions
app.types.submissions.index=false
app.types.submissions.fetchChildren=ccm:submission
app.types.submissions.reindexParent.enabled = true

app.types.submission.type=ccm:submission
app.types.submission.index=false
app.types.submission.reindexParent.enabled = true
app.types.submission.reindexParent.maxLookAHead = 2

valuespace.languages=de_DE,en_US
valuespace.cache.check.after.ms=120000

tracker.fetchThumbnails = true
tracker.delay = 5000
tracker.shutdown.on.exception=true
tracker.fetch.size.alfresco = 100
tracker.bulk.size.elastic = 50

#debug=true


tracker.main.excludeNodeTypes=sys:container,sys:store_root,cm:zone,cm:person,cm:authorityContainer,cm:thumbnail,sys:archiveUser,ccm:share,ccm:comment
tracker.main.numberOfTransactions=200
tracker.main.threads=4
tracker.main.indexStoreRefs=workspace://SpacesStore,archive://SpacesStore
tracker.main.workspace-sub-types=ccm:io,ccm:rating,ccm:comment,ccm:usage,ccm:collection_proposal
tracker.main.storeIdentifier=SpacesStore

tracker.statistics.dependsOn=mainTracker
tracker.statisticsalfresco.include-node-types=ccm:io
tracker.statisticsalfresco.storeProtocol=workspace
tracker.statisticsalfresco.storeIdentifier=SpacesStore
tracker.statisticsalfresco.scheduler.schedulerName=statisticsTracker
tracker.statisticsalfresco.depends-on=mainTracker

tracker.authorities.numberOfTransactions=500
tracker.authorities.includeNodeTypes=cm:person,cm:authorityContainer
tracker.authorities.indexStoreRefs=workspace://SpacesStore

# would filter deletes
#tracker.collection.includeNodeTypes=ccm:collection_proposal,ccm:usage,ccm:io,ccm:map
tracker.collection.workspace-types=ccm:collection_proposal,ccm:usage,ccm:io,ccm:map
tracker.collection.excludeNodeTypes=sys:container,sys:store_root,cm:zone,cm:person,cm:authorityContainer,cm:thumbnail,sys:archiveUser
tracker.collection.exclude-aspects=ccm:collection_io_reference
tracker.collection.storeProtocol=workspace
tracker.collection.storeIdentifier=SpacesStore
tracker.collection.dependsOn=mainTracker

tracker.preview.numberOfTransactions=1200
tracker.preview.includeNodeTypes=ccm:io,ccm:map
tracker.preview.storeProtocol=workspace
tracker.preview.storeIdentifier=SpacesStore
tracker.preview.dependsOn=mainTracker

tracker.acl.numberOfTransactions = 200
tracker.acl.threads=4
tracker.acl.depends-on=mainTracker

#tracker.share.depends-on=mainTracker
#tracker.useractivity.depends-on=mainTracker

tracker.suggestion.depends-on=mainTracker
tracker.suggestion.include-node-types=ccm:io,ccm:map
tracker.suggestion.indexStoreRefs=workspace://SpacesStore

tracker.relation.depends-on=mainTracker
tracker.relation.include-node-types=ccm:io
tracker.relation.indexStoreRefs=workspace://SpacesStore




management.endpoint.health.probes.enabled = true
management.endpoint.health.show-details = always
management.endpoint.health.show-components = always
# timeout since which a last method run is considered acceptable, in minutes
management.endpoint.health.trackingTimeoutThreshold=720

management.endpoints.web.exposure.include = health,metrics,prometheus

management.server.address=0.0.0.0
management.server.port=8081

spring.jmx.enabled = true

trackContent = true
# max length of a fulltext (default 10MB). When the fulltext of a node is longer, it will be truncated to this size. Value of 0 will disable the limit
maxContentLength: 10485760

statistic.enabled = true
statistic.historyInDays = 90
statistic.delay = 6000


relations.enabled = true
relations.delay = 6000

edusharing.sessionvalidate.delay=600000

scriptExecutor.scriptsLocation=/opt/alfresco/scripts

shutdown.on.exception=true

userActivities.enabled=true
userActivities.delay = 6000

shares.enabled=true
