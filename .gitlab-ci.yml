variables:
  COMMON_BIND_HOST: "0.0.0.0"
  DEPLOY_DOCKER_HELM: "true"
  DEPLOY_TIMESTAMP: "$DEPLOY_TIMESTAMP"
  DOCKER_DRIVER: "$DIND_DRIVER"
  DOCKER_HOST: "$DIND_HOST"
  DOCKER_TLS_CERTDIR: "$DIND_TLS_CERTDIR"
  MAVEN_CLI: "-Ddocker.registry=$DOCKER_REGISTRY -Dhelm.deploy.url=$HELM_REGISTRY -Dhelm.deploy.type=$HELM_TYPE -Dmaven.deploy.releases=$MAVEN_DEPLOY_RELEASES -Dmaven.deploy.snapshots=$MAVEN_DEPLOY_SNAPSHOTS --batch-mode --errors --fail-fast --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

default:
  image: maven:3.8.4-eclipse-temurin-17
  services:
    - name: "$DIND_IMAGE"
      alias: docker
      entrypoint: [ "env", "-u", "DOCKER_HOST" ]
      command: [ "dockerd-entrypoint.sh" ]

stages:
  - test
  - deploy

check-helmreadme:
  stage: test
  image: node:lts-alpine3.20
  before_script:
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/index/src/main/chart /tmp/index && cp /tmp/index/README.md /tmp/README_index.md
    - ln -s $CI_PROJECT_DIR/deploy/docker/helm/tracker/src/main/chart /tmp/tracker && cp /tmp/tracker/README.md /tmp/README_tracker.md
  script:
    - wget -qO- https://github.com/bitnami/readme-generator-for-helm/archive/refs/tags/2.6.1.tar.gz | tar -xz -C /tmp
    - cd /tmp; npm install ./readme-generator-for-helm-2.6.1; cd readme-generator-for-helm-2.6.1
    - ./bin/index.js -v /tmp/index/values.yaml -r /tmp/README_index.md
    - ./bin/index.js -v /tmp/tracker/values.yaml -r /tmp/README_tracker.md
    - diff /tmp/README_index.md /tmp/index/README.md       || (echo "README was not generated before committing." && exit 1)
    - diff /tmp/README_tracker.md /tmp/tracker/README.md   || (echo "README was not generated before committing." && exit 1)

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^maven\/release\/.*/ && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH =~ /^maven\/fixes\/.*/ && $CI_COMMIT_TAG == null
    - if: $CI_COMMIT_BRANCH =~ /^maven\/feature\/\d+\.\d+[_-].*/ && $PROJECT_NAME && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "pipeline" #Feature branches build pipeline only in
  script:
    - mvn $MAVEN_CLI -s .mvn/settings.xml deploy
