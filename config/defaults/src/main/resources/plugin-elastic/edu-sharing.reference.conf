elasticsearch: {
  servers: ["127.0.0.1:9200"]
  max_response_entity_size: 104857600

  # Semantic search over the chunk index the RAG tracker maintains.
  rag: {
    # The alias the tracker points at the active embedding profile's index. Searching the alias
    # rather than a physical index is what makes a profile switch atomic and invisible here.
    alias: "rag_chunks"

    # How close a chunk has to sit to the question before the vector branch returns it, in the
    # index's own metric (cosine for the default profile). This value decides relevance for the
    # whole search: if nothing clears it, the result is empty and the lexical branch is not even
    # run - it can widen a relevant result, not create one.
    #
    # Measured on German OER with bge-m3 over a mixed corpus: chunks that genuinely answer the
    # question sit at 0.50 to 0.55, an unanswerable question tops out at 0.44. 0.47 sits between
    # them with about equal margin. The band is narrower than it looks - an earlier 0.5 was set
    # from two documents alone and cut answers that belonged in the result. Every hit reports its
    # own `similarity`, so measure against real questions before changing this.
    minSimilarity: 0.47

    # How much of the question the lexical branch has to find. The default match operator is OR,
    # so one incidental stem would be enough to call a chunk a match.
    #
    # Not "2<70%": that demands ALL terms as soon as a query has exactly two, and German stopword
    # removal leaves "Wie addiert man Brüche?" as [addiert, bruch] - it silenced the lexical branch
    # for ordinary questions.
    minimumShouldMatch: "1<70%"

    embedding: {
      # Endpoint of the embedding service, OpenAI-compatible (/v1/embeddings). No default on
      # purpose: without it the semantic endpoint fails saying it is not configured, which is a
      # better answer than a connection timeout against a host that was never meant to exist.
      # In the compose stack this is the tracker's own embedding service, which listens on 80 -
      # the same value TRACKER_RAG_PROFILES_0_BASEURL carries, and it must stay the same value,
      # because both sides have to embed with one model for the vectors to be comparable:
      #   baseUrl: "http://repository-search-elastic-embedding"
      #
      # How long to wait for a vector. Embedding one question is sub-second work, so this is not
      # a latency budget - it is the point at which something is wrong, and in practice that is
      # memory or CPU pressure from an answer model on the same host. Raising it hides the cause.
      timeoutSeconds: 60

      # Which model to use is NOT configured here - it is read from the index's _meta, so it
      # cannot drift away from the model that built the vectors.
    }

    # Answer synthesis. Off by default: it sends chunk text to whatever model is configured, and
    # for a corpus whose fulltexts are not all public that is a decision, not a default.
    answer: {
      # none | openai-compatible | anthropic
      #
      #   openai-compatible - the /v1/chat/completions PROTOCOL, not the company. Ollama, vLLM,
      #                       llama.cpp and most hosted services speak it alike. Cost and data
      #                       flow are decided by baseUrl below, NOT by this setting: pointed at
      #                       a container of your own it is free and the passages stay in-house;
      #                       pointed at a commercial endpoint it bills per token and sends them
      #                       there. ("openai" is still accepted but reads like a vendor choice.)
      #
      #   anthropic         - the Anthropic Messages API. Better answers, billed per token, and
      #                       the passages are sent to an external service.
      provider: "none"

      # openai-compatible: required. The local answer container is
      #   "http://repository-search-elastic-llm:11434"
      # anthropic: optional, defaults to https://api.anthropic.com
      # baseUrl: ""

      # openai-compatible: required, the model name the endpoint serves, e.g.
#   qwen2.5:1.5b-instruct (Apache-2.0, the local container's default)
      # anthropic: defaults to claude-opus-5
      # model: ""

      # anthropic: required. openai-compatible: only if the endpoint wants a bearer token - a
      # local container does not.
      # apiKey: ""

      # Sized for a self-hosted model on CPU, where these values decide whether an answer arrives
      # at all. Measured on 16 threads with qwen2.5 7B: 1.8 generated tokens per second, about 19
      # for reading the prompt - so the passage count matters more than the answer length.
      maxTokens: 400

      # 0 so the same question over the same passages gives the same answer - a search result that
      # changes between two identical requests is not something a teacher can cite.
      temperature: 0

      # How many retrieved chunks go into the prompt, and a ceiling on their total length.
      # Twelve passages are roughly 5000 tokens, which on CPU is minutes before the first word.
      # Raise both where the model runs on a GPU or is hosted.
      maxPassages: 6
      maxPromptChars: 12000

      # Generous, because the slow path here is a cold CPU-bound model, not a broken one. It is
      # here to catch a hung service; the levers for latency are the model, maxPassages and
      # maxTokens above. Cutting off mid-answer throws away the whole computation.
      timeoutSeconds: 900
    }
  }
}
